<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comenzi Mese</title>
<style>
  :root {
    --bg: #f2f2f7; --card: #fff; --text: #1c1c1e; --muted: #8e8e93;
    --sep: #e5e5ea; --blue: #007aff; --red: #ff3b30; --fill: #f2f2f7;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px;
  }
  h1 { margin: 0; font-size: 26px; font-weight: 700; }
  button {
    font: inherit; border: 0; cursor: pointer; border-radius: 10px;
    padding: 8px 14px; background: var(--fill); color: var(--blue); font-weight: 600;
  }
  button:hover { filter: brightness(.96); }
  button.primary { background: var(--blue); color: #fff; }
  button.danger { background: var(--red); color: #fff; }
  button.round {
    width: 38px; height: 38px; padding: 0; border-radius: 50%;
    font-size: 22px; line-height: 38px; display: grid; place-items: center;
  }
  button.round.add { background: var(--blue); color: #fff; }
  button.round.trash { color: var(--red); }
  button.round svg { width: 20px; height: 20px; }

  main {
    flex: 1; min-height: 0; overflow-y: auto; display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    grid-auto-rows: minmax(280px, calc((100vh - 106px) / 2));
    gap: 14px; padding: 0 20px 20px;
  }
  .table {
    background: var(--card); border-radius: 16px; display: flex; flex-direction: column;
    min-height: 0; box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .table-head {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 14px; border-bottom: 1px solid var(--sep);
  }
  .table-head h2 { margin: 0; font-size: 20px; overflow-wrap: anywhere; }
  .table-head .add { justify-self: end; }
  .items { list-style: none; margin: 0; padding: 0 14px; overflow-y: auto; flex: 1; }
  .items li {
    display: flex; align-items: center; gap: 8px; padding: 10px 0;
    border-bottom: 1px solid var(--sep);
  }
  .items li .name { flex: 1; }
  .items li .qty { min-width: 22px; text-align: center; font-weight: 600; }
  .items li button { width: 28px; height: 28px; padding: 0; border-radius: 50%; }
  .empty { color: var(--muted); text-align: center; padding: 24px 0; }
  .total {
    padding: 12px 14px; border-top: 1px solid var(--sep);
    display: flex; justify-content: space-between; font-weight: 600;
  }

  dialog {
    border: 0; border-radius: 14px; padding: 0; width: 560px; max-width: 90vw;
    max-height: 85vh; box-shadow: 0 10px 40px rgba(0,0,0,.2);
  }
  dialog::backdrop { background: rgba(0,0,0,.3); }
  .dlg { display: flex; flex-direction: column; max-height: 85vh; }
  .dlg-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px; border-bottom: 1px solid var(--sep);
  }
  .dlg-head h3 { margin: 0; font-size: 17px; }
  .dlg-body { overflow-y: auto; padding: 8px 16px 16px; }
  .cat { margin: 14px 0 4px; font-size: 13px; color: var(--muted); text-transform: uppercase; }
  .pick {
    display: flex; width: 100%; justify-content: space-between; text-align: left;
    background: none; color: var(--text); font-weight: 400; border-radius: 0;
    border-bottom: 1px solid var(--sep); padding: 10px 2px;
  }
  .pick:hover { background: var(--fill); }
  .pick small { color: var(--muted); }
  input[type=search], .edit input {
    font: inherit; border: 0; background: var(--fill); border-radius: 10px; padding: 8px 10px;
  }
  input[type=search] { width: 100%; margin-top: 10px; }
  .edit { display: grid; grid-template-columns: 1fr 70px 70px 52px 28px; align-items: center; gap: 6px; margin-bottom: 6px; }
  .edit input { min-width: 0; }
  .edit button { padding: 0; color: var(--red); background: none; font-size: 18px; }
  header .row { display: flex; gap: 10px; }
  #zBtn, #histBtn, #tblBtn { background: var(--card); }
  .chk { display: flex; align-items: center; gap: 3px; font-size: 13px; color: var(--muted); }
  .items li.sgr { color: var(--muted); font-size: 14px; }
  .z-day { display: flex; justify-content: space-between; margin: 18px 0 6px; font-size: 17px; font-weight: 700; }
  .z-day:first-child { margin-top: 8px; }
  .z-actions { text-align: right; margin: -4px 0 6px; }
  .z-actions .danger-text { margin-top: 0; }
  .z-table { display: flex; justify-content: space-between; padding: 8px 0 4px; font-weight: 600; border-top: 1px solid var(--sep); }
  .z-bon { display: flex; justify-content: space-between; padding: 3px 0 3px 16px; }
  .z-bon small { color: var(--muted); margin-left: 6px; }
  #histList .empty { margin: 0; padding: 4px 0 8px; text-align: left; }
  .hist-head { display: flex; justify-content: space-between; align-items: center; }
  .hist-head .cat { margin-bottom: 4px; }
  button.danger-text { color: var(--red); padding: 4px 10px; margin-top: 10px; font-size: 13px; }
  .hist { padding: 10px 0; border-bottom: 1px solid var(--sep); }
  .hist-top { display: flex; justify-content: space-between; margin-bottom: 2px; }
  .hist-items { color: var(--muted); font-size: 14px; }
  .tbl-edit { grid-template-columns: 1fr 28px; }
  @media (max-width: 600px) {
    header { flex-wrap: wrap; gap: 10px; padding: 12px 16px; }
    main { padding: 0 16px 16px; grid-auto-rows: minmax(280px, auto); }
    dialog:not(#confirmDlg) { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; margin: 0; border-radius: 0; }
    dialog:not(#confirmDlg) .dlg { height: 100dvh; max-height: 100dvh; }
    .hist-top { gap: 10px; }
    button.danger-text { padding: 8px 12px; }
  }
  .confirm { padding: 20px; text-align: center; }
  .confirm p { margin: 0 0 18px; }
  .confirm .row { display: flex; gap: 10px; justify-content: center; }
</style>
</head>
<body>
<header>
  <h1>Comenzi mese</h1>
  <div class="row"><button id="zBtn">Z-uri</button>
  <button id="histBtn">Istoric mese</button>
  <button id="tblBtn">Mese</button>
  <button id="menuBtn" class="primary">+ Meniu</button></div>
</header>
<main id="tables"></main>

<dialog id="pickDlg">
  <div class="dlg">
    <div class="dlg-head"><h3 id="pickTitle"></h3><button data-close>Gata</button></div>
    <div class="dlg-body">
      <input type="search" id="pickSearch" placeholder="Caută produs…">
      <div id="pickList"></div>
    </div>
  </div>
</dialog>

<dialog id="menuDlg">
  <div class="dlg">
    <div class="dlg-head"><h3>Produse din meniu</h3><button data-close>Gata</button></div>
    <div class="dlg-body" id="menuList"></div>
  </div>
</dialog>

<dialog id="histDlg">
  <div class="dlg">
    <div class="dlg-head"><h3>Istoric mese</h3><button data-close>Gata</button></div>
    <div class="dlg-body" id="histList"></div>
  </div>
</dialog>

<dialog id="tblDlg">
  <div class="dlg">
    <div class="dlg-head"><h3>Mese</h3><button data-close>Gata</button></div>
    <div class="dlg-body" id="tblList"></div>
  </div>
</dialog>

<dialog id="zDlg">
  <div class="dlg">
    <div class="dlg-head"><h3>Z-uri</h3><button data-close>Gata</button></div>
    <div class="dlg-body" id="zList"></div>
  </div>
</dialog>

<dialog id="confirmDlg">
  <div class="confirm">
    <p id="confirmText"></p>
    <div class="row">
      <button data-close>Anulează</button>
      <button id="confirmOk" class="danger">Golește masa</button>
    </div>
  </div>
</dialog>

<script>
const TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>';

// Default menu from Maylin Caffe "Meniu" PDF. cat | name | size | price (lei)
const DEFAULT_MENU = `
Hot Drinks|Espresso|30ml|8
Hot Drinks|Espresso dublu|60ml|10
Hot Drinks|Espresso macchiato|60ml|9
Hot Drinks|Cafea lungă|120ml|9
Hot Drinks|Americano|120ml|9
Hot Drinks|Cafea cu lapte|200ml|10
Hot Drinks|Cappuccino|200ml|10
Hot Drinks|Caffe Latte|320ml|15
Hot Drinks|Flat White|200ml|12
Hot Drinks|Irish Coffee|200ml|12
Hot Drinks|Frappe|350ml|15
Hot Drinks|Ice Latte|350ml|15
Hot Drinks|Espresso Tonic|350ml|15
Hot Drinks|Ciocolată caldă neagră|260ml|12
Hot Drinks|Ciocolată caldă albă|260ml|12
Hot Drinks|Ceai Cireșe|400ml|12
Hot Drinks|Ceai Fructe de pădure|400ml|12
Hot Drinks|Ceai Exotic|400ml|12
Hot Drinks|Ceai Iasomie|400ml|12
Hot Drinks|Ceai Mentă|400ml|12
Hot Drinks|Ceai plic||7
Extra|Deco Coffee||3
Extra|Lapte vegetal||3
Extra|Sirop||3
Limonadă|Limonadă clasică|350ml|14
Limonadă|Limonadă grapefruit|350ml|14
Croissants & Cookies|Croissant|70g|8
Croissants & Cookies|Croissant cu ciocolată|95g|9
Croissants & Cookies|Cookies|76g|10
Răcoritoare|Pepsi Normal|500ml|10|sgr
Răcoritoare|Pepsi Twist|500ml|10|sgr
Răcoritoare|Pepsi Zero|500ml|10|sgr
Răcoritoare|Mountain Dew|500ml|10|sgr
Răcoritoare|7 Up|500ml|10|sgr
Răcoritoare|Mirinda Orange|500ml|10|sgr
Răcoritoare|Prigat Portocale|500ml|10|sgr
Răcoritoare|Prigat Piersici|500ml|10|sgr
Răcoritoare|Prigat Căpșuni + Banane|500ml|10|sgr
Răcoritoare|Lipton Lămâie / Piersici|500ml|10|sgr
Răcoritoare|Apă minerală|500ml|8|sgr
Răcoritoare|Apă plată|500ml|8|sgr
Bere|Bere Draft|400ml|12
Bere|Ursus Premium|500ml|10
Bere|Ursus Black|500ml|10
Bere|Ursus Remix|330ml|8|sgr
Bere|Ciucaș Gold|500ml|8
Bere|Peroni|500ml|12
Bere fără alcool|Ursus fără alcool|500ml|12
Bere fără alcool|Ursus Cooler|300ml|8|sgr
Vin|Strunga Velier Sauv. Blanc Sec|0.75l|90
Vin|Strunga Velier Cabernet Sauv. Rosé|0.75l|90
Vin|Strunga Muscat Ottonel Carafă|1l|35
Vin|Cotnari Concept Frâncușă alb sec|0.75l|70
Vin|Cotnari Concept Rosé|0.75l|70
Vin|Cotnari Concept Roșu|0.75l|70
Vin|Spumant ZAZ alb brut|0.75l|60
Vin|Spumant ZAZ rosé demisec|0.75l|60
`.trim().split('\n').map(l => { const [cat, name, size, price, sgr] = l.split('|'); return { cat, name, size, price: +price, sgr: !!sgr }; });

// Storage: this browser only. try/catch so a blocked storage never breaks the page.
function load(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
}
function save() {
  try { localStorage.setItem('tables', JSON.stringify(tables)); localStorage.setItem('menu_v3', JSON.stringify(menu)); localStorage.setItem('zlog', JSON.stringify(zlog)); localStorage.setItem('history', JSON.stringify(history)); localStorage.setItem('orders', JSON.stringify(orders)); } catch {}
}
// v2 -> v3: keep the user's edits, split the water item and set the SGR flags from the default menu
let menu = load('menu_v3', null) ?? load('menu_v2', DEFAULT_MENU).flatMap(m => m.name.startsWith('Aqua Carpatica')
  ? DEFAULT_MENU.filter(d => d.name.startsWith('Apă'))
  : [{ ...m, sgr: DEFAULT_MENU.find(d => d.name === m.name)?.sgr ?? !!m.sgr }]);
// orders[t] = [{name, price, n}] — a snapshot, so editing the menu never changes open tables
// tables[t] = name; orders[t] and history[t] are kept parallel to it
let tables = load('tables', ['Masa 1', 'Masa 2', 'Masa 3', 'Masa 4', 'Masa 5', 'Masa 6', 'Masa protocol']);
let orders = load('orders', []);
// history[t] = [{at, items, total}], newest first; filled when a table is cleared
let history = load('history', []);
tables.forEach((_, t) => { orders[t] ??= []; history[t] ??= []; });
// zlog = every cleared table [{at, t: table name, total}]; separate from history so deleting history keeps the Z reports
let zlog = load('zlog', null) ?? history.flatMap((l, t) => l.map(h => ({ at: h.at, t: tables[t], total: h.total })));

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const lei = n => `${(Math.round(n * 100) / 100).toLocaleString('ro-RO')} lei`;
const SGR = 0.5;
// the order plus one automatic "Taxa SGR" line for every SGR product
function bill(items) {
  const n = items.reduce((s, i) => s + (i.sgr ? i.n : 0), 0);
  return n ? [...items, { name: 'Taxa SGR', price: SGR, n }] : items;
}
const sum = items => items.reduce((s, i) => s + i.price * i.n, 0);

function renderTables() {
  $('#tables').innerHTML = orders.map((items, t) => {
    const all = bill(items), total = sum(all);
    return `<section class="table">
      <div class="table-head">
        <h2>${esc(tables[t])}</h2>
        <button class="round trash" data-clear="${t}" title="Golește masa" aria-label="Golește ${esc(tables[t])}">${TRASH}</button>
        <button class="round add" data-add="${t}" title="Adaugă produs" aria-label="Adaugă produs la ${esc(tables[t])}">+</button>
      </div>
      <ul class="items">${items.length ? items.map((i, k) => `
        <li><span class="name">${esc(i.name)}</span>
          <button data-dec="${t},${k}" aria-label="Scade">−</button>
          <span class="qty">${i.n}</span>
          <button data-inc="${t},${k}" aria-label="Adaugă">+</button></li>`).join('')
        : '<li class="empty">Nicio comandă</li>'}${all.length > items.length ? `
        <li class="sgr"><span class="name">Taxa SGR</span><span>${all.at(-1).n} × ${lei(SGR)}</span></li>` : ''}</ul>
      <div class="total"><span>Total</span><span>${lei(total)}</span></div>
    </section>`;
  }).join('');
}

function addItem(t, item) {
  const row = orders[t].find(i => i.name === item.name && i.price === item.price && !!i.sgr === !!item.sgr);
  row ? row.n++ : orders[t].push({ name: item.name, price: item.price, sgr: !!item.sgr, n: 1 });
  save(); renderTables();
}

// ---- product picker for one table
let pickTable = 0;
function renderPick() {
  const q = $('#pickSearch').value.trim().toLowerCase();
  let html = '', cat = '';
  menu.forEach((m, idx) => {
    if (q && !m.name.toLowerCase().includes(q)) return;
    if (m.cat !== cat) { cat = m.cat; html += `<div class="cat">${esc(cat)}</div>`; }
    html += `<button class="pick" data-pick="${idx}"><span>${esc(m.name)} <small>${esc(m.size || '')}</small></span><span>${lei(m.price)}</span></button>`;
  });
  $('#pickList').innerHTML = html || '<p class="empty">Niciun produs găsit</p>';
}

// ---- menu editor
function renderMenu() {
  let html = '', cat = null;
  menu.forEach((m, idx) => {
    if (m.cat !== cat) { cat = m.cat; html += `<div class="cat">${esc(cat)}</div>`; }
    html += `<div class="edit">
      <input value="${esc(m.name)}" data-f="name" data-i="${idx}" aria-label="Nume">
      <input value="${esc(m.size || '')}" data-f="size" data-i="${idx}" placeholder="ml/g" aria-label="Cantitate">
      <input type="number" min="0" step="0.5" value="${m.price}" data-f="price" data-i="${idx}" aria-label="Preț">
      <label class="chk"><input type="checkbox" data-f="sgr" data-i="${idx}" ${m.sgr ? 'checked' : ''}> SGR</label>
      <button data-del="${idx}" title="Șterge" aria-label="Șterge ${esc(m.name)}">✕</button>
    </div>`;
  });
  const cats = [...new Set(menu.map(m => m.cat))];
  html += `<div class="cat">Produs nou</div>
    <div class="edit" style="grid-template-columns:1fr 1fr 70px 70px 52px">
      <input id="newName" placeholder="Nume">
      <input id="newCat" list="cats" placeholder="Categorie">
      <input id="newSize" placeholder="ml/g">
      <input id="newPrice" type="number" min="0" step="0.5" placeholder="lei">
      <label class="chk"><input type="checkbox" id="newSgr"> SGR</label>
    </div>
    <datalist id="cats">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
    <button id="newAdd" class="primary" style="margin-top:6px">Adaugă în meniu</button>`;
  $('#menuList').innerHTML = html;
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if ('close' in d) b.closest('dialog').close();
  else if (d.add) { pickTable = +d.add; $('#pickTitle').textContent = `Adaugă la ${tables[pickTable]}`; $('#pickSearch').value = ''; renderPick(); $('#pickDlg').showModal(); }
  else if (d.pick) addItem(pickTable, menu[d.pick]);
  else if (d.inc || d.dec) {
    const [t, k] = (d.inc || d.dec).split(',').map(Number);
    orders[t][k].n += d.inc ? 1 : -1;
    if (orders[t][k].n < 1) orders[t].splice(k, 1);
    save(); renderTables();
  }
  else if (d.clear) {
    const t = +d.clear;
    if (!orders[t].length) return;
    ask(`Sigur golești ${tables[t]}? Toate produsele vor fi șterse.`, 'Golește masa', () => {
      const items = bill(orders[t]), at = Date.now(), total = sum(items);
      history[t].unshift({ at, items, total });
      zlog.push({ at, t: tables[t], total });
      orders[t] = []; save(); renderTables();
    });
  }
  else if (b.id === 'zBtn') { renderZ(); $('#zDlg').showModal(); }
  else if (d.zdel) {
    const d0 = d.zdel, day = ms => new Date(ms).toLocaleDateString('ro-RO', { day: '2-digit', month: '2-digit', year: 'numeric' });
    ask(`Ștergi toate bonurile din ziua ${d0}?`, 'Șterge ziua', () => { zlog = zlog.filter(z => day(z.at) !== d0); save(); renderZ(); });
  }
  else if (b.id === 'histBtn') { renderHistory(); $('#histDlg').showModal(); }
  else if (d.histClear) {
    const t = +d.histClear;
    ask(`Ștergi istoricul pentru ${tables[t]}?`, 'Șterge istoricul', () => { history[t] = []; save(); renderHistory(); });
  }
  else if (b.id === 'tblBtn') { renderTableEditor(); $('#tblDlg').showModal(); }
  else if (d.tblDel) {
    const t = +d.tblDel;
    ask(`Ștergi ${tables[t]}? Comanda deschisă și istoricul ei se șterg și ele.`, 'Șterge masa', () => {
      tables.splice(t, 1); orders.splice(t, 1); history.splice(t, 1);
      save(); renderTables(); renderTableEditor();
    });
  }
  else if (b.id === 'tblAdd') {
    const name = $('#tblNew').value.trim();
    if (!name) { $('#tblNew').focus(); return; }
    tables.push(name); orders.push([]); history.push([]);
    save(); renderTables(); renderTableEditor();
  }
  else if (b.id === 'menuBtn') { renderMenu(); $('#menuDlg').showModal(); }
  else if (d.del) {
    const idx = +d.del;
    ask(`Ștergi „${menu[idx].name}” din meniu?`, 'Șterge', () => { menu.splice(idx, 1); save(); renderMenu(); });
  }
  else if (b.id === 'newAdd') {
    const name = $('#newName').value.trim(), cat = $('#newCat').value.trim() || 'Altele';
    const price = parseFloat($('#newPrice').value);
    if (!name || !(price >= 0)) { $('#newName').focus(); return; }
    // insert after the last item of the same category so groups stay together
    let at = menu.map(m => m.cat).lastIndexOf(cat);
    menu.splice(at < 0 ? menu.length : at + 1, 0, { cat, name, size: $('#newSize').value.trim(), price, sgr: $('#newSgr').checked });
    save(); renderMenu();
  }
});
function renderTableEditor() {
  $('#tblList').innerHTML = tables.map((name, t) => `<div class="edit tbl-edit">
      <input value="${esc(name)}" data-tbl="${t}" aria-label="Nume masă">
      <button data-tbl-del="${t}" title="Șterge" aria-label="Șterge ${esc(name)}">✕</button>
    </div>`).join('') + `<div class="cat">Masă nouă</div>
    <div class="edit tbl-edit"><input id="tblNew" placeholder="ex. Terasă 1"></div>
    <button id="tblAdd" class="primary" style="margin-top:6px">Adaugă masă</button>`;
}
$('#tblList').addEventListener('change', e => {
  const t = e.target.dataset.tbl; if (t == null) return;
  const v = e.target.value.trim();
  if (!v) { e.target.value = tables[t]; return; }
  tables[t] = v; save(); renderTables();
});
function renderZ() {
  const day = ms => new Date(ms).toLocaleDateString('ro-RO', { day: '2-digit', month: '2-digit', year: 'numeric' });
  const time = ms => new Date(ms).toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit' });
  const days = Map.groupBy([...zlog].sort((a, b) => b.at - a.at), z => day(z.at)); // newest day first
  $('#zList').innerHTML = [...days].map(([d, bons]) => {
    const byTable = Map.groupBy(bons, z => z.t);
    return `<div class="z-day"><span>Ziua ${d}</span><span>${lei(bons.reduce((s, z) => s + z.total, 0))}</span></div>
      <div class="z-actions"><button data-zdel="${d}" class="danger-text">Șterge ziua</button></div>` +
      [...byTable].sort(([a], [b]) => a.localeCompare(b, 'ro', { numeric: true })).map(([t, list]) => {
        list = list.sort((a, b) => a.at - b.at);
        return `<div class="z-table"><span>${esc(t)}</span><span>${lei(list.reduce((s, z) => s + z.total, 0))} total</span></div>` +
          list.map((z, k) => `<div class="z-bon"><span>Bonul ${k + 1}<small>${time(z.at)}</small></span><span>${lei(z.total)}</span></div>`).join('');
      }).join('');
  }).join('') || '<p class="empty">Nu există încă bonuri. Un bon se creează când golești o masă.</p>';
}
function renderHistory() {
  const when = ms => new Date(ms).toLocaleString('ro-RO', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  $('#histList').innerHTML = history.map((list, t) => `
    <div class="hist-head"><div class="cat">${esc(tables[t])}</div>
      ${list.length ? `<button data-hist-clear="${t}" class="danger-text">Șterge istoricul</button>` : ''}</div>
    ${list.length ? list.map(h => `<div class="hist">
      <div class="hist-top"><span>${when(h.at)}</span><b>${lei(h.total)}</b></div>
      <div class="hist-items">${h.items.map(i => `${i.n} × ${esc(i.name)}`).join(', ')}</div>
    </div>`).join('') : '<p class="empty">Niciun istoric</p>'}`).join('');
}
function ask(text, okLabel, onOk) {
  $('#confirmText').textContent = text;
  $('#confirmOk').textContent = okLabel;
  $('#confirmOk').onclick = () => { $('#confirmDlg').close(); onOk(); };
  $('#confirmDlg').showModal();
}

$('#menuList').addEventListener('change', e => {
  const { f, i } = e.target.dataset; if (!f) return;
  const v = e.target.value.trim();
  if (f === 'sgr') menu[i].sgr = e.target.checked;
  else if (f === 'price') { const p = parseFloat(v); if (!(p >= 0)) { e.target.value = menu[i].price; return; } menu[i].price = p; }
  else if (f === 'name' && !v) { e.target.value = menu[i].name; return; }
  else menu[i][f] = v;
  save();
});
$('#pickSearch').addEventListener('input', renderPick);

renderTables();
</script>
</body>
